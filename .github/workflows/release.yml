name: Release Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a utiliser pour la release (ex. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determiner la version
        # La version de l'installateur doit venir du TAG. On lit les variables
        # d'environnement NATIVES du runner (GITHUB_REF_NAME) au lieu des
        # expressions ${{ github.ref_name }} : cette étape échouait en 1 s sur
        # le runner (tout le reste du job était ignoré), le script n'allant
        # jamais jusqu'à la compilation.
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_TAG } else { $env:GITHUB_REF_NAME }
          if (-not $tag) { throw 'Tag introuvable : precise le tag en dispatch manuel.' }
          $version = $tag -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+') { throw "Version invalide depuis le tag '$tag' : $version" }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "TAG_REF=$tag" >> $env:GITHUB_ENV
          "Version de l'installateur : $version"

      - name: Installer Inno Setup
        # choco installe la derniere version majeure (7.x). Le chemin est
        # decouvert dynamiquement : INNO_SETUP_PATH etait fige sur la 6 (x86),
        # et Compil32.exe a disparu a partir d'Inno Setup 6.3 au profit de
        # ISCC.exe — l'ancien workflow echouait donc systematiquement.
        # LIA-X.iss utilise ArchitecturesAllowed=x64compatible (Inno 6.3+).
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-ChildItem -Path "${env:ProgramFiles(x86)}\Inno Setup*","$env:ProgramFiles\Inno Setup*" `
                                 -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) { throw "ISCC.exe introuvable apres installation d'Inno Setup" }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verifier les assets graphiques
        # Les .bmp / .ico sont des binaires versionnes : une divergence ferait
        # diverger l'installateur de l'icone du logo. On echoue plutot que de
        # compiler avec des images obsoletes ou manquantes.
        run: |
          foreach ($f in @('logo.ico','wizard.bmp','wizard-small.bmp','logo-big.bmp')) {
            $p = Join-Path $env:GITHUB_WORKSPACE "installer\$f"
            if (-not (Test-Path $p)) { throw "Asset manquant : installer\$f" }
            "  {0,-18} {1} octets" -f $f, (Get-Item $p).Length
          }

      - name: Verifier que l'application se construit
        # GARDE-FOU. Sans cette etape, la release publiait un installeur sans
        # jamais construire l'interface : deux releases ont ainsi ete publiees
        # alors que le depot ne compilait pas (un fichier manquant du .gitignore).
        # On ne construit donc jamais, et l'on ne publie jamais, un code dont le
        # frontend ne se construit pas.
        working-directory: model-manager
        run: |
          npm ci --no-audit --no-fund
          $env:VITE_API_BASE_URL = ''
          npm run build
          if (-not (Test-Path 'dist\index.html')) {
            throw 'Le build n a pas produit dist\index.html.'
          }
          "Build OK : $((Get-ChildItem 'dist' -Recurse -File | Measure-Object).Count) fichiers dans dist\"

      - name: Aligner package.json sur la version du tag
        # L'endpoint /api/version lit model-manager/package.json, tandis que la
        # version de l'installateur vient du tag (/DAppVersion). Sans ce
        # raccordement, un utilisateur installant 2.0.1 lisait « 2.0.0 » dans
        # l'application : toute detection de mise a jour etait faussee.
        # L'image Docker etant construite a l'INSTALLATION (par l'ISS), le
        # package.json corrige doit etre EMBALLE dans l'installateur : cette
        # etape doit donc preceder la compilation ISCC.
        run: |
          $pkgPath = Join-Path $env:GITHUB_WORKSPACE 'model-manager\package.json'
          $pkg = Get-Content -LiteralPath $pkgPath -Raw | ConvertFrom-Json
          "Version package.json : $($pkg.version)"
          $pkg.version = $env:APP_VERSION
          $json = ($pkg | ConvertTo-Json -Depth 10)
          # UTF-8 sans BOM : un BOM ferait echouer npm plus tard.
          [System.IO.File]::WriteAllText($pkgPath, $json, (New-Object System.Text.UTF8Encoding $false))
          $check = (Get-Content -LiteralPath $pkgPath -Raw | ConvertFrom-Json).version
          if ($check -ne $env:APP_VERSION) { throw "package.json non aligne : $check" }
          "Version alignee sur le tag : $check"

      - name: Compiler l'installateur
        # LIA-X.iss ecrit dans dist\ (OutputDir), relatif au .iss : on compile
        # depuis installer\ et l'EXE atterrit donc dans installer\dist\.
        # /DAppVersion injecte la version du tag (voir LIA-X.iss, #ifndef).
        working-directory: installer
        run: '& $env:ISCC_PATH LIA-X.iss /DAppVersion=$env:APP_VERSION'

      - name: Verifier la sortie
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE 'installer\dist\LIA-X-Setup.exe'
          if (-not (Test-Path $exe)) { throw "LIA-X-Setup.exe absent apres compilation" }
          $mb = [math]::Round((Get-Item $exe).Length / 1MB, 2)
          "LIA-X-Setup.exe : $mb Mo"
          if ($mb -lt 1) { throw "Installateur suspect ($mb Mo) : la compression a-t-elle echoue ?" }
          # La version doit etre celle du tag, sinon les metadonnees Windows
          # et Parametres > Applications afficheront autre chose.
          $vi = (Get-Item $exe).VersionInfo
          "ProductVersion FileVersion : $($vi.ProductVersion) / $($vi.FileVersion)"
          if ($vi.ProductVersion -notlike "$env:APP_VERSION*") {
            throw "Version de l'installateur ($($vi.ProductVersion)) differente du tag ($env:APP_VERSION)."
          }

      - name: Generer la somme de controle
        # Sans SHA256, l'utilisateur ne peut pas verifier l'integrite du
        # telechargement — d'autant que l'EXE n'est signe par personne.
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE 'installer\dist'
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $dir 'LIA-X-Setup.exe')).Hash
          "SHA256 (LIA-X-Setup.exe) = $hash" | Set-Content -Path (Join-Path $dir 'SHA256SUMS.txt') -Encoding ascii
          Get-Content -LiteralPath (Join-Path $dir 'SHA256SUMS.txt')

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: lia-x-setup
          path: installer/dist/LIA-X-Setup.exe
          if-no-files-found: error

      - name: Creer la GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # Sur push de tag, github.ref_name EST le tag : l'utiliser plutot
          # que inputs.tag (vide), sinon softprops echoue si le tag existe.
          tag_name: ${{ env.TAG_REF }}
          name: LIA-X ${{ env.APP_VERSION }}
          files: |
            installer/dist/LIA-X-Setup.exe
            installer/dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

